function safeGetItem(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function safeSetItem(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function loadPersisted(key, fallback) {
  const v = safeGetItem(key);
  return v !== null ? v : fallback;
}
function getPeriode(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function compressImage(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else if (h >= w && h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        let out = canvas.toDataURL('image/jpeg', quality);
        let q = quality;
        while (out.length > 700000 && q > 0.25) {
          q = q - 0.1;
          out = canvas.toDataURL('image/jpeg', q);
        }
        if (out.length > 700000) { reject(new Error('Foto terlalu besar, coba foto dengan resolusi lebih kecil')); return; }
        resolve(out);
      };
      img.onerror = function () { reject(new Error('gagal load gambar')); };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('gagal baca file')); };
    reader.readAsDataURL(file);
  });
}

const excelSerialToDate = (serial) => {
  const utcDays = Math.floor(serial - 25569);
  const d = new Date(utcDays * 86400 * 1000);
  return d.toISOString().slice(0, 10);
};
const parseExcelDate = (val) => {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number') return excelSerialToDate(val);
  if (val instanceof Date) return val.toISOString().slice(0, 10);
  return String(val);
};
const getField = (row, key) => {
  const foundKey = Object.keys(row).find(function (k) { return k.trim().toLowerCase() === key.trim().toLowerCase(); });
  return foundKey ? row[foundKey] : '';
};
const downloadExcel = (rows, filename, sheetName) => {
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
};
const downloadTemplate = (headers, filename, sheetName) => {
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
};
// sheets: [{ rows: [...], name: 'Sheet1' }, { rows: [...], name: 'Sheet2' }]
const downloadExcelMultiSheet = (sheets, filename) => {
  const wb = XLSX.utils.book_new();
  sheets.forEach(function (s) {
    const ws = s.rows.length ? XLSX.utils.json_to_sheet(s.rows) : XLSX.utils.aoa_to_sheet([s.headers || []]);
    XLSX.utils.book_append_sheet(wb, ws, s.name);
  });
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
};

  useEffect(function () { safeSetItem('dasawisma_users', users); }, [users]);

  // Akun (login) disinkronkan lewat Firebase supaya akun warga yang dibuat pengurus
  // bisa dipakai login dari HP warga sendiri, bukan cuma tersimpan lokal di HP pengurus.
  useEffect(function () {
    if (!chatDb) return;
    const unsub = chatDb.collection('dasawisma_users').onSnapshot(function (snapshot) {
      if (snapshot.empty) {
        const batch = chatDb.batch();
        loadPersisted('dasawisma_users', seedUsers).forEach(function (u) {
          const ref = chatDb.collection('dasawisma_users').doc('u-' + String(u.username).toLowerCase());
          batch.set(ref, { namaLengkap: u.namaLengkap, username: u.username, password: u.password, role: u.role, wargaId: u.wargaId || null });
        });
        batch.commit().catch(function () {});
        return;
      }
      const items = snapshot.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
      setUsers(items);
    }, function () {});
    return function () { unsub(); };
  }, []);

  // Kalau sesi login sedang aktif, selaraskan dengan data akun terbaru (mis. setelah akun
  // lama bermigrasi ke Firebase dan id-nya berubah, atau role/password diubah dari HP lain).
  useEffect(function () {
    if (!currentUser || users.length === 0) return;
    const match = users.find(function (u) { return u.username === currentUser.username; });

  useEffect(function () {
    if (!chatDb) return;

    return function () { unsub(); };

          const anggotaSheetName = wb.SheetNames.find(function (n) { return n.trim().toLowerCase() === 'anggota keluarga'; });

          if (wargaJson.length === 0) { showToast('File kosong atau tidak terbaca', 'error'); return; }
          const anggotaJson = anggotaSheetName ? XLSX.utils.sheet_to_json(wb.Sheets[anggotaSheetName], { defval: '' }) : [];

          const anggotaByKey = {};
          anggotaJson.forEach(function (row) {
            const key = String(getField(row, 'ID Keluarga') || getField(row, 'Nama Kepala Keluarga') || '').trim().toLowerCase();

              pendidikan: String(getField(row, 'Pendidikan') || ''), pekerjaan: String(getField(row, 'Pekerjaan') || '')
            });
          });

          const mapped = wargaJson.map(function (row) {
            const namaKK = String(getField(row, 'Nama Kepala Keluarga')).trim();
            const idKey = String(getField(row, 'ID Keluarga') || '').trim().toLowerCase();
            const nameKey = namaKK.toLowerCase();
            const anggota = (idKey && anggotaByKey[idKey]) ? anggotaByKey[idKey] : (anggotaByKey[nameKey] || []);
            return {
              id: nextId(),
              namaKK: namaKK,
              rt: String(getField(row, 'RT') || ''), alamat: String(getField(row, 'Alamat') || ''),
              anggota: anggota,
              balita: Number(getField(row, 'Balita')) || 0, pus: Number(getField(row, 'PUS')) || 0, wus: Number(getField(row, 'WUS')) || 0,

            };
          }).filter(function (w) { return w.namaKK; });
          if (mapped.length === 0) { showToast('Tidak ada data terbaca. Cek kolom "Nama Kepala Keluarga" di file.', 'error'); return; }

              batch.set(chatDb.collection('dasawisma_warga').doc(String(w.id)), w);
              count++;
              if (count === 400) { chunks.push(batch.commit()); batch = chatDb.batch(); count = 0; }

                <div>
                  <label className="text-xs font-medium text-slate-500">Tanggal Pembayaran</label>
                  <input type="date" value={iuranForm.tanggal} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { tanggal: e.target.value })); }} className="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm" />
                </div>
                <div className="bg-slate-50 rounded-xl p-3 space-y-2">
                  <p className="text-xs font-semibold text-slate-600 mb-1">Rincian Pembagian</p>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs text-slate-600 flex-1">Kas PKK</span>
                    <input type="number" min="0" value={iuranForm.pkk} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { pkk: Number(e.target.value) || 0 })); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs text-slate-600 flex-1">Posyandu</span>
                    <input type="number" min="0" value={iuranForm.posyandu} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { posyandu: Number(e.target.value) || 0 })); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs text-slate-600 flex-1">Kas Dawis</span>
                    <input type="number" min="0" value={iuranForm.dawis} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { dawis: Number(e.target.value) || 0 })); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs text-slate-600 flex-1">Arisan</span>
                    <input type="number" min="0" value={iuranForm.arisan} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { arisan: Number(e.target.value) || 0 })); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-xs text-slate-600 flex-1">Lain-lain</span>
                    <input type="number" min="0" value={iuranForm.lainLain} onChange={function (e) { setIuranForm(Object.assign({}, iuranForm, { lainLain: Number(e.target.value) || 0 })); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                  </div>
                  <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-200">
                    <span className="text-xs font-semibold text-slate-700 flex-1">Total</span>
                    <span className="text-sm font-bold text-rose-600">{formatRupiah(Number(iuranForm.pkk || 0) + Number(iuranForm.posyandu || 0) + Number(iuranForm.dawis || 0) + Number(iuranForm.arisan || 0) + Number(iuranForm.lainLain || 0))}</span>
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500">Foto Bukti Pembayaran (opsional)</label>
                  {iuranForm.attachment ? (
                    <div className="mt-1 flex items-center justify-between bg-slate-50 rounded-xl px-3 py-2.5">
                      <div className="flex items-center gap-2 min-w-0">
                        <IconPaperclip className="w-4 h-4 text-slate-400 shrink-0" />
                        <span className="text-xs text-slate-600 truncate">{iuranForm.attachment.name}</span>
                      </div>
                      <button onClick={function () { setIuranForm(Object.assign({}, iuranForm, { attachment: null })); }}><IconX className="w-4 h-4 text-red-400" /></button>
                    </div>
                  ) : (
                    <label className="mt-1 flex items-center justify-center gap-2 border border-dashed border-slate-300 rounded-xl py-3 text-xs text-slate-500 cursor-pointer">
                      <IconUpload className="w-4 h-4" /> Pilih foto bukti transfer/tunai
                      <input type="file" accept="image/*" className="hidden" onChange={handleIuranAttachment} />
                    </label>
                  )}
                </div>
                <button onClick={saveIuran} className="w-full bg-rose-600 text-white font-semibold py-3 rounded-xl">Simpan Iuran</button>
              </div>
            </div>
          </div>
        )}

        {akunWargaModal && (
          <div className="fixed inset-0 z-40 flex items-center justify-center px-6" style={{ backgroundColor: 'rgba(15,23,42,0.5)' }} onClick={function () { setAkunWargaModal(null); }}>
            <div className="bg-white rounded-2xl p-5 w-full max-w-xs" onClick={function (e) { e.stopPropagation(); }}>
              <p className="font-bold text-slate-800 mb-1">{akunWargaModal.mode === 'create' ? 'Buat Akun Login' : 'Reset Akun'}</p>
              <p className="text-xs text-slate-400 mb-4">{akunWargaModal.namaKK}</p>
              <div className="space-y-3">
                <div>
                  <label className="text-xs font-medium text-slate-500">Jenis Akun</label>
                  <div className="flex gap-2 mt-1">
                    {['anggota', 'pengurus'].map(function (r) {
                      return <button key={r} onClick={function () { setAkunWargaForm(Object.assign({}, akunWargaForm, { role: r })); }} className={'flex-1 py-2 rounded-xl text-xs font-medium border ' + (akunWargaForm.role === r ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-slate-500 border-slate-200')}>{r === 'anggota' ? 'Anggota' : 'Pengurus'}</button>;
                    })}
                  </div>
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500">Username</label>
                  <input value={akunWargaForm.username} onChange={function (e) { setAkunWargaForm(Object.assign({}, akunWargaForm, { username: e.target.value })); }} className="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500">Password {akunWargaModal.mode === 'reset' ? 'Baru' : ''}</label>
                  <input type="text" value={akunWargaForm.password} onChange={function (e) { setAkunWargaForm(Object.assign({}, akunWargaForm, { password: e.target.value })); }} className="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm" />
                </div>
              </div>
              <div className="flex gap-2 mt-4">
                <button onClick={function () { setAkunWargaModal(null); }} className="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-medium">Batal</button>
                <button onClick={saveAkunWarga} className="flex-1 bg-rose-600 text-white py-2.5 rounded-xl text-sm font-medium">Simpan</button>
              </div>
            </div>
          </div>
        )}

        {pengajuanModal && (
          <div className="fixed inset-0 z-40 flex items-end justify-center" style={{ backgroundColor: 'rgba(15,23,42,0.5)' }} onClick={function () { setPengajuanModal(false); }}>
            <div className="w-full max-w-md bg-white rounded-t-3xl overflow-y-auto" style={{ maxHeight: '90vh' }} onClick={function (e) { e.stopPropagation(); }}>
              <div className="sticky top-0 bg-white px-5 pt-4 pb-3 border-b border-slate-100 flex justify-between items-center">
                <p className="font-bold text-slate-800">Ajukan Pembayaran</p>
                <button onClick={function () { setPengajuanModal(false); }}><IconX className="w-5 h-5 text-slate-400" /></button>
              </div>
              <div className="p-5 space-y-4">
                <div>
                  <label className="text-xs font-medium text-slate-500">Nominal Transfer (Rp)</label>
                  <input type="number" min="0" value={pengajuanForm.nominal} onChange={function (e) { setPengajuanForm(Object.assign({}, pengajuanForm, { nominal: Number(e.target.value) || 0 })); }} className="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500">Tanggal Pembayaran</label>
                  <input type="date" value={pengajuanForm.tanggal} onChange={function (e) { setPengajuanForm(Object.assign({}, pengajuanForm, { tanggal: e.target.value })); }} className="w-full mt-1 px-3 py-2.5 border border-slate-200 rounded-xl text-sm" />
                </div>
                <div>
                  <label className="text-xs font-medium text-slate-500">Foto Bukti Transfer</label>
                  {pengajuanForm.bukti ? (
                    <div className="mt-1">
                      <img src={pengajuanForm.bukti} className="w-full rounded-xl" alt="bukti" />
                      <button onClick={function () { setPengajuanForm(Object.assign({}, pengajuanForm, { bukti: null })); }} className="text-xs text-red-500 mt-2">Hapus foto</button>
                    </div>
                  ) : (
                    <label className="mt-1 flex items-center justify-center gap-2 border border-dashed border-slate-300 rounded-xl py-3 text-xs text-slate-500 cursor-pointer">
                      <IconUpload className="w-4 h-4" /> Pilih foto bukti transfer
                      <input type="file" accept="image/*" className="hidden" onChange={handlePengajuanBukti} />
                    </label>
                  )}
                </div>
                <button onClick={submitPengajuan} className="w-full bg-rose-600 text-white font-semibold py-3 rounded-xl">Kirim ke Pengurus</button>
              </div>
            </div>
          </div>
        )}

        {klasifikasiModal && (
          <div className="fixed inset-0 z-40 flex items-end justify-center" style={{ backgroundColor: 'rgba(15,23,42,0.5)' }} onClick={function () { setKlasifikasiModal(null); }}>
            <div className="w-full max-w-md bg-white rounded-t-3xl overflow-y-auto" style={{ maxHeight: '90vh' }} onClick={function (e) { e.stopPropagation(); }}>
              <div className="sticky top-0 bg-white px-5 pt-4 pb-3 border-b border-slate-100 flex justify-between items-center">
                <p className="font-bold text-slate-800">Klasifikasi Pembayaran</p>
                <button onClick={function () { setKlasifikasiModal(null); }}><IconX className="w-5 h-5 text-slate-400" /></button>
              </div>
              <div className="p-5 space-y-4">
                <div className="bg-slate-50 rounded-xl p-3">
                  <p className="text-xs text-slate-500">Dari: {klasifikasiModal.namaPengaju}</p>
                  <p className="text-xs text-slate-500">Tanggal: {formatTanggal(klasifikasiModal.tanggal)}</p>
                  <p className="text-sm font-bold text-slate-800 mt-1">Nominal Diajukan: {formatRupiah(klasifikasiModal.nominal)}</p>
                </div>
                {klasifikasiModal.buktiDataUrl && <img src={klasifikasiModal.buktiDataUrl} className="w-full rounded-xl" alt="bukti" />}
                <div className="space-y-2">
                  {[['kasPkk', 'Kas PKK'], ['kasDawis', 'Kas Dawis'], ['posyandu', 'Posyandu'], ['arisan', 'Arisan'], ['lainLain', 'Lain-lain']].map(function (pair) {
                    return (
                      <div key={pair[0]} className="flex items-center justify-between gap-2">
                        <span className="text-xs text-slate-600 flex-1">{pair[1]}</span>
                        <input type="number" min="0" value={klasifikasiForm[pair[0]]} onChange={function (e) { const v = {}; v[pair[0]] = Number(e.target.value) || 0; setKlasifikasiForm(Object.assign({}, klasifikasiForm, v)); }} className="w-24 px-2 py-1.5 border border-slate-200 rounded-lg text-xs text-right" />
                      </div>
                    );
                  })}
                  <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-200">
                    <span className="text-xs font-semibold text-slate-700 flex-1">Total Klasifikasi</span>
                    <span className={'text-sm font-bold ' + (klasifikasiTotal(klasifikasiForm) === Number(klasifikasiModal.nominal) ? 'text-emerald-600' : 'text-red-500')}>{formatRupiah(klasifikasiTotal(klasifikasiForm))}</span>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={function () { rejectTagihan(klasifikasiModal); }} className="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl text-sm font-medium">Tolak</button>
                  <button onClick={approveTagihan} className="flex-1 bg-rose-600 text-white py-2.5 rounded-xl text-sm font-medium">Setujui</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {confirmDelete && (
          <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ backgroundColor: 'rgba(15,23,42,0.5)' }}>
            <div className="bg-white rounded-2xl p-5 w-full max-w-xs text-center">
              <IconAlertCircle className="w-10 h-10 text-red-500 mx-auto mb-2" />
              <p className="font-semibold text-slate-800 text-sm">Hapus Data?</p>
              <p className="text-xs text-slate-500 mt-1">"{confirmDelete.label}" akan dihapus permanen.</p>
              <div className="flex gap-2 mt-4">
                <button onClick={function () { setConfirmDelete(null); }} className="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-medium">Batal</button>
                <button onClick={confirmDeleteAction} className="flex-1 bg-red-600 text-white py-2.5 rounded-xl text-sm font-medium">Hapus</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
